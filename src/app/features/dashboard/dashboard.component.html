<div
  class="min-h-screen flex bg-surface-50 dark:bg-surface-950 text-surface-900 dark:text-surface-50 transition-colors duration-300 relative"
>
  @if (isRouteLoading()) {
    <div
      class="absolute inset-0 bg-transparent backdrop-blur-[1px] z-50 flex items-center justify-center transition-all"
    >
      <p-progressSpinner ariaLabel="loading" strokeWidth="4" fill="transparent"></p-progressSpinner>
    </div>
  }

  <aside
    class="w-16 md:w-64 border-r border-surface-200 dark:border-surface-800 bg-surface-0 dark:bg-surface-900 flex flex-col justify-between z-20 p-2 md:p-3 transition-all duration-300"
  >
    <div class="space-y-4">
      <div
        class="h-12 hidden md:flex items-center justify-center md:justify-start gap-3 px-2 border-b border-surface-200 dark:border-surface-800 pb-3"
      >
        <span
          class="hidden md:inline font-bold text-m uppercase tracking-wider text-surface-800 dark:text-surface-100 whitespace-nowrap"
        >
          Fleet Control
        </span>
      </div>

      <p-menu
        [model]="navigationItems"
        [unstyled]="true"
        class="w-full block"
        [pt]="{
          submenuLabel: {
            class:
              'text-[10px] font-bold uppercase hidden md:block tracking-wider text-surface-400 dark:text-surface-500 px-3 pb-1 select-none',
          },
        }"
      >
        <ng-template pTemplate="item" let-item>
          <a
            [routerLink]="item.routerLink"
            routerLinkActive="active-state-marker"
            #rla="routerLinkActive"
            [routerLinkActiveOptions]="item.routerLinkActiveOptions || { exact: false }"
            class="flex items-center justify-center md:justify-start gap-3 px-4 py-2.5 my-1 text-sm font-medium transition-all duration-200 cursor-pointer group rounded-md border-l-4"
            [ngClass]="
              rla.isActive
                ? 'bg-surface-100 dark:bg-surface-800 text-emerald-500 dark:text-emerald-400 border-emerald-500 shadow-sm'
                : 'border-transparent text-surface-500 hover:text-surface-800 dark:hover:text-surface-200 hover:bg-surface-50 dark:hover:bg-surface-800/40'
            "
          >
            <i
              [class]="item.icon"
              class="text-base transition-transform group-hover:scale-105"
              [ngClass]="
                rla.isActive
                  ? 'text-emerald-500 dark:text-emerald-400'
                  : 'text-surface-400 group-hover:text-surface-700 dark:group-hover:text-surface-200'
              "
            ></i>
            <span class="hidden md:inline whitespace-nowrap">{{ item.label }}</span>
          </a>
        </ng-template>
      </p-menu>
    </div>

    <div class="pt-3 border-t border-surface-200 dark:border-surface-800">
      <p-button
        [icon]="themeService.isDarkMode() ? 'pi pi-sun' : 'pi pi-moon'"
        (onClick)="themeService.toggleTheme()"
        styleClass="p-button-text w-full justify-center text-surface-500 hover:text-surface-800 px-3 py-2"
        class="md:hidden block"
      >
      </p-button>
      <p-button
        [icon]="themeService.isDarkMode() ? 'pi pi-sun' : 'pi pi-moon'"
        [label]="themeService.isDarkMode() ? 'LIGHT MODE' : 'DARK MODE'"
        (onClick)="themeService.toggleTheme()"
        styleClass="p-button-text w-full justify-start text-xs font-semibold text-surface-500 hover:text-surface-800 dark:hover:text-surface-200 px-3 py-2"
        class="hidden md:block"
      >
      </p-button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <p-toolbar
      styleClass="h-15 px-6 bg-surface-0 dark:bg-surface-900 border-t-0 border-x-0 border-b border-surface-200 dark:border-surface-800 rounded-none shadow-sm"
    >
      <ng-template pTemplate="start">
        <div class="flex items-center gap-2">
          <span
            class="text-xs font-semibold px-2 py-0.5 rounded bg-surface-100 dark:bg-surface-800 text-surface-600 dark:text-surface-400 font-mono"
            >NODE-01</span
          >
          <span class="text-xs text-surface-400">/</span>
          <span class="text-xs font-semibold text-surface-500 uppercase tracking-wider">System Control Matrix</span>
        </div>
      </ng-template>

      <ng-template pTemplate="end">
        <div class="flex items-center gap-3">
          <div class="flex flex-col text-right hidden sm:flex">
            <span class="text-xs font-bold text-surface-800 dark:text-surface-200">Security Proxy</span>
            <span class="text-[10px] font-mono text-emerald-500">ADMIN</span>
          </div>
          <p-avatar
            label="SC"
            shape="circle"
            styleClass="bg-emerald-500/10 text-emerald-500 font-bold text-xs border border-emerald-500/20"
          ></p-avatar>
        </div>
      </ng-template>
    </p-toolbar>

    <main class="flex-1 overflow-y-auto p-3 md:p-3">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
